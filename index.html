<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="桌球社群成員互動地圖，依居住地、桌球程度、角色與是否單身篩選球友。">
  <title>🏓 桌球同好地圖</title>
  <style>
    :root {
      --ink: #18222d;
      --muted: #65717f;
      --paper: #fffefa;
      --cream: #f7f4ec;
      --line: #dedbd1;
      --accent: #176b5b;
      --accent-dark: #104d42;
      --accent-soft: #dff2eb;
      --warm: #ffcf66;
      --shadow: 0 18px 50px rgba(32, 46, 55, .10);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(255, 207, 102, .28), transparent 28rem),
        radial-gradient(circle at 95% 16%, rgba(111, 206, 183, .22), transparent 30rem),
        var(--cream);
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      line-height: 1.6;
    }

    button, select, input { font: inherit; }
    button { color: inherit; }
    .rainbow-line {
      height: 7px;
      background: linear-gradient(90deg, #e94155 0 16.66%, #f28b28 16.66% 33.33%, #f2d34f 33.33% 50%, #3aac6d 50% 66.66%, #3f82d6 66.66% 83.33%, #8c57bd 83.33%);
    }

    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 42px 0 26px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border: 1px solid rgba(23, 107, 91, .22);
      border-radius: 999px;
      color: var(--accent-dark);
      background: rgba(255, 255, 255, .72);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    h1 { margin: 14px 0 6px; font-size: clamp(34px, 6vw, 62px); line-height: 1.05; letter-spacing: -.045em; }
    .lead { max-width: 720px; margin: 0; color: var(--muted); font-size: 17px; }
    .top-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .stat {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .74);
    }
    .stat strong { font-size: 22px; color: var(--accent-dark); }
    .stat span { color: var(--muted); font-size: 13px; }

    .filter-card, .map-card, .members-card {
      background: rgba(255, 254, 250, .94);
      border: 1px solid rgba(210, 207, 198, .82);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .filter-card { padding: 20px; margin-bottom: 18px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 15px; }
    .section-heading h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .clear-button {
      border: 0;
      border-radius: 12px;
      padding: 9px 13px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-weight: 800;
      cursor: pointer;
    }
    .clear-button:hover { background: #cce9df; }
    .clear-button:focus-visible, .member-row:focus-visible, .flag-marker:focus-visible, .modal-close:focus-visible {
      outline: 3px solid rgba(23, 107, 91, .32);
      outline-offset: 3px;
    }

    .filter-grid { display: grid; grid-template-columns: minmax(170px, .8fr) repeat(3, minmax(190px, 1fr)); gap: 18px; }
    .filter-group { min-width: 0; }
    .filter-group h3, .filter-group label.select-label { display: block; margin: 0 0 8px; font-size: 14px; font-weight: 900; }
    select {
      width: 100%;
      min-height: 43px;
      padding: 8px 38px 8px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
    }
    .choice-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .choice {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }
    .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); font-weight: 800; }
    .choice input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }

    .content-grid { display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(280px, .75fr); gap: 18px; align-items: start; }
    .map-card { position: relative; overflow: visible; min-height: 0; padding: 18px; }
    .map-card::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -100px;
      bottom: -110px;
      border-radius: 50%;
      background: rgba(255, 207, 102, .18);
      pointer-events: none;
    }
    .map-topline { display: flex; justify-content: space-between; gap: 14px; align-items: center; position: relative; z-index: 2; }
    .map-topline h2 { margin: 0; font-size: 20px; }
    .map-note { margin: 0; color: var(--muted); font-size: 13px; }
    .map-wrap { position: relative; display: grid; place-items: center; width: 100%; min-height: 760px; height: auto; overflow: hidden; }
    #taiwan-map { display: block; width: min(100%, 780px); height: auto; overflow: hidden; touch-action: none; cursor: grab; }
    #taiwan-map.is-panning { cursor: grabbing; }
    .map-controls { position: absolute; z-index: 4; top: 14px; right: 14px; display: grid; grid-template-columns: repeat(3, 42px); gap: 6px; }
    .map-controls button { width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255, 254, 250, .95); color: var(--ink); box-shadow: 0 4px 12px rgba(33, 43, 49, .13); cursor: pointer; font: 900 20px/1 system-ui, sans-serif; }
    .map-controls button:last-child { font-size: 14px; }
    .map-controls button:focus-visible { outline: 3px solid rgba(45, 125, 101, .28); outline-offset: 2px; }
    .map-gesture-hint { position: absolute; z-index: 3; left: 50%; bottom: 12px; transform: translateX(-50%); margin: 0; padding: 7px 12px; border-radius: 999px; background: rgba(33, 43, 49, .78); color: #fff; font-size: 12px; font-weight: 800; white-space: nowrap; pointer-events: none; }
    .township {
      fill: #e4e1d8;
      stroke: #fffefa;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
      stroke-linejoin: round;
      transition: fill .2s ease, opacity .2s ease;
    }
    .township.has-members { fill: #b7ddcf; }
    .township.filtered-out { opacity: .42; }
    .township:hover { fill: #cbded7; }
    .inset-frame rect { fill: #f7f4ec; stroke: #cfcbc0; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .inset-frame text { fill: var(--muted); font-size: 13px; font-weight: 900; text-anchor: middle; }
    .township[data-county="新北市"], .township[data-county="桃園市"], .township[data-county="臺南市"], .township[data-county="臺東縣"] { stroke-width: 1.15; }
    .unplaced-note { margin: 0 8px 8px; padding: 12px 14px; border: 1px dashed #c8a95d; border-radius: 14px; background: #fff8e7; color: #64542f; font-size: 13px; }
    .unplaced-note:empty { display: none; }
    .flag-marker { cursor: pointer; filter: drop-shadow(0 6px 5px rgba(33, 43, 49, .23)); }
    .flag-marker .pole { stroke: #3e4a53; stroke-width: 2; }
    .flag-marker .flag-outline { fill: #fff; stroke: #fff; stroke-width: 3; }
    .flag-marker .marker-label-bg { fill: #fffefa; stroke: #d5d2c8; }
    .flag-marker .marker-label { fill: var(--ink); font-size: 11px; font-weight: 900; text-anchor: middle; }
    .flag-marker .count-badge { fill: var(--ink); }
    .flag-marker .count-text { fill: #fff; font-size: 9px; font-weight: 900; text-anchor: middle; }
    .flag-marker .district-map-label {
      fill: #143e33;
      font-size: 14px;
      font-weight: 950;
      text-anchor: middle;
      paint-order: stroke fill;
      stroke: #fff;
      stroke-width: 4px;
      stroke-linejoin: round;
      stroke-linecap: round;
      letter-spacing: 1px;
      user-select: none;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .18));
    }
    .flag-marker:hover .district-map-label { fill: var(--accent-dark); }

    .members-card { min-height: 0; display: flex; flex-direction: column; overflow: visible; }
    .members-head { padding: 20px 20px 14px; border-bottom: 1px solid var(--line); }
    .members-head h2 { margin: 0 0 3px; font-size: 20px; }
    .members-head p { margin: 0; color: var(--muted); font-size: 13px; }
    .member-list { padding: 12px; display: grid; gap: 9px; overflow: visible; max-height: none; }
    .member-row {
      width: 100%;
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 11px;
      border: 1px solid transparent;
      border-radius: 16px;
      padding: 11px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .member-row:hover { border-color: var(--line); background: #fff; }
    .avatar { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-dark); font-weight: 950; }
    .member-main strong { display: block; line-height: 1.25; }
    .member-main span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .city-tag { padding: 5px 8px; border-radius: 999px; background: #f2efe7; color: #5b625f; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .empty-state { padding: 50px 20px; text-align: center; color: var(--muted); }
    .empty-state strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

    footer { display: grid; justify-items: center; gap: 12px; padding: 28px 0 42px; color: var(--muted); font-size: 13px; text-align: center; }
    .privacy-note { display: inline-flex; gap: 7px; align-items: center; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,.72); border: 1px solid var(--line); }
    .community-link { color: var(--accent-dark); font-size: 15px; font-weight: 900; text-decoration-thickness: 2px; text-underline-offset: 4px; }
    .community-link:hover { color: var(--accent); }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(15, 25, 31, .62);
      backdrop-filter: blur(8px);
    }
    .modal[hidden] { display: none; }
    .modal-dialog {
      width: min(560px, 100%);
      max-height: min(760px, calc(100vh - 36px));
      overflow: auto;
      border-radius: 26px;
      background: var(--paper);
      box-shadow: 0 28px 80px rgba(0,0,0,.28);
    }
    .modal-rainbow { height: 8px; border-radius: 26px 26px 0 0; background: linear-gradient(90deg,#e94155 0 16.66%,#f28b28 16.66% 33.33%,#f2d34f 33.33% 50%,#3aac6d 50% 66.66%,#3f82d6 66.66% 83.33%,#8c57bd 83.33%); }
    .modal-inner { padding: 22px; }
    .modal-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .modal-title { margin: 0; font-size: 28px; line-height: 1.2; }
    .modal-subtitle { margin: 4px 0 0; color: var(--muted); }
    .modal-close { flex: 0 0 auto; width: 38px; height: 38px; border: 0; border-radius: 50%; background: #eeece5; cursor: pointer; font-size: 22px; line-height: 1; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    .detail { padding: 13px; border: 1px solid var(--line); border-radius: 15px; background: #fff; }
    .detail.wide { grid-column: 1 / -1; }
    .detail dt { margin: 0 0 3px; color: var(--muted); font-size: 12px; font-weight: 800; }
    .detail dd { margin: 0; font-weight: 800; overflow-wrap: anywhere; }
    .message-box { margin-top: 12px; padding: 16px; border-radius: 16px; background: var(--accent-soft); color: var(--accent-dark); }
    .message-box small { display: block; margin-bottom: 4px; font-weight: 900; }
    .message-box p { margin: 0; font-weight: 700; }
    .city-picker { display: grid; gap: 9px; margin-top: 18px; }
    .city-picker button { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: #fff; text-align: left; cursor: pointer; }
    .city-picker button:hover { border-color: var(--accent); background: var(--accent-soft); }

    @media (max-width: 980px) {
      .filter-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 820px) {
      .content-grid { grid-template-columns: 1fr; }
      .map-card, .members-card { min-height: 0; }
      .members-card { order: 2; }
      .member-list { max-height: none; }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 20px, 1220px); }
      header { padding-top: 28px; }
      .lead { font-size: 15px; }
      .filter-card { padding: 15px; }
      .filter-grid { grid-template-columns: 1fr; gap: 15px; }
      .section-heading { align-items: flex-start; }
      .map-card { padding: 14px 8px; border-radius: 20px; }
      .map-topline { padding: 0 8px; align-items: flex-start; flex-direction: column; gap: 2px; }
      .map-wrap { min-height: 0; height: auto; }
      .map-controls { top: 10px; right: 10px; grid-template-columns: repeat(3, 38px); }
      .map-controls button { width: 38px; height: 38px; }
      .members-card { border-radius: 20px; }
      .member-row { grid-template-columns: 40px minmax(0, 1fr); }
      .city-tag { grid-column: 2; justify-self: start; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail.wide { grid-column: auto; }
      .modal-inner { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="rainbow-line" aria-hidden="true"></div>
  <header class="shell">
    <span class="eyebrow">🏓 LINE 桌球社群</span>
    <h1>桌球同好地圖</h1>
    <p class="lead">找找附近的球友，看看彼此的程度與有空時間。點擊彩虹旗或成員名單，就能認識更多一起打球的夥伴。</p>
    <div class="top-stats" aria-live="polite">
      <div class="stat"><strong id="result-count">0</strong><span>位符合條件</span></div>
      <div class="stat"><strong id="city-count">0</strong><span>個地區有球友</span></div>
    </div>
  </header>

  <main class="shell">
    <section class="filter-card" aria-labelledby="filter-title">
      <div class="section-heading">
        <h2 id="filter-title">篩選球友</h2>
        <button class="clear-button" id="clear-filters" type="button">清除篩選</button>
      </div>
      <div class="filter-grid">
        <div class="filter-group">
          <label class="select-label" for="city-filter">居住地</label>
          <select id="city-filter"><option value="all">全部地區</option></select>
        </div>
        <fieldset class="filter-group" style="border:0;padding:0;margin:0">
          <legend style="padding:0;margin:0 0 8px;font-size:14px;font-weight:900">桌球程度</legend>
          <div class="choice-list" id="level-filters"></div>
        </fieldset>
        <fieldset class="filter-group" style="border:0;padding:0;margin:0">
          <legend style="padding:0;margin:0 0 8px;font-size:14px;font-weight:900">角色</legend>
          <div class="choice-list" id="role-filters"></div>
        </fieldset>
        <fieldset class="filter-group" style="border:0;padding:0;margin:0">
          <legend style="padding:0;margin:0 0 8px;font-size:14px;font-weight:900">是否單身</legend>
          <div class="choice-list" id="single-filters"></div>
        </fieldset>
      </div>
    </section>

    <div class="content-grid">
      <section class="map-card" aria-labelledby="map-title">
        <div class="map-topline">
          <h2 id="map-title">台灣鄉鎮市區分布</h2>
          <p class="map-note">旗標精準定位至鄉鎮市區</p>
        </div>
        <div class="map-wrap">
          <div class="map-controls" aria-label="地圖縮放控制">
            <button id="map-zoom-in" type="button" aria-label="放大地圖">＋</button>
            <button id="map-zoom-out" type="button" aria-label="縮小地圖">−</button>
            <button id="map-reset" type="button" aria-label="重設地圖">重設</button>
          </div>
          <p class="map-gesture-hint">雙指縮放・拖曳移動</p>
          <svg id="taiwan-map" viewBox="0 0 760 830" role="img" aria-label="台灣鄉鎮市區球友分布地圖">

    function createChoice(containerId, values, type, name, onChange, allLabel) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      if (type === "radio" && allLabel) {
        const all = document.createElement("label");
        all.className = "choice";
        all.innerHTML = `<input type="radio" name="${name}" value="all" checked><span>${allLabel}</span>`;
        all.querySelector("input").addEventListener("change", onChange);
        container.appendChild(all);
      }
      values.forEach(value => {
        const label = document.createElement("label");
        label.className = "choice";
        const input = document.createElement("input");
        input.type = type;
        input.name = name;
        input.value = value;
        input.addEventListener("change", onChange);
        const span = document.createElement("span");
        span.textContent = value;
        label.append(input, span);
        container.appendChild(label);
      });
    }

    function clampMapView(view) {
      const width = Math.max(baseMapView.width / 8, Math.min(baseMapView.width, view.width));
      const height = width * baseMapView.height / baseMapView.width;
      return {
        x: Math.max(0, Math.min(baseMapView.width - width, view.x)),
        y: Math.max(0, Math.min(baseMapView.height - height, view.y)),
        width,
        height
      };
    }

    function applyMapView(view) {
      mapView = clampMapView(view);
      taiwanMap.setAttribute("viewBox", `${mapView.x} ${mapView.y} ${mapView.width} ${mapView.height}`);
      const zoom = baseMapView.width / mapView.width;

    function clientPointToMap(clientX, clientY, view = mapView) {
      const rect = taiwanMap.getBoundingClientRect();
      return {
        x: view.x + (clientX - rect.left) / rect.width * view.width,
        y: view.y + (clientY - rect.top) / rect.height * view.height
      };
    }

    function zoomMapAt(clientX, clientY, factor) {
      const anchor = clientPointToMap(clientX, clientY);
      const rect = taiwanMap.getBoundingClientRect();
      const width = mapView.width / factor;
      const height = width * baseMapView.height / baseMapView.width;
      applyMapView({
        x: anchor.x - (clientX - rect.left) / rect.width * width,
        y: anchor.y - (clientY - rect.top) / rect.height * height,
        width,
        height
      });
    }

    function startPinch() {
      if (mapPointers.size < 2) { pinchStart = null; return; }
      const [a, b] = [...mapPointers.values()].slice(0, 2);
      const midpoint = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      pinchStart = {
        distance: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
        view: { ...mapView },
        anchor: clientPointToMap(midpoint.x, midpoint.y)
      };
    }

        });
        const labelWidth = Math.max(48, Math.min(92, cityMembers.map(m => m.name).join("、").length * 12 + 18));
        g.appendChild(makeSvg("rect", { class: "marker-label-bg", x: String(-labelWidth / 2 + 1), y: "10", width: String(labelWidth), height: "23", rx: "11.5" }));
        const label = makeSvg("text", { class: "marker-label", x: "1", y: "25" });
        label.textContent = cityMembers.length === 1 ? cityMembers[0].name : city;
        g.appendChild(label);
        if (cityMembers.length > 1) {
          g.appendChild(makeSvg("circle", { class: "count-badge", cx: "52", cy: "-27", r: "10" }));
          const count = makeSvg("text", { class: "count-text", x: "52", y: "-24" });
          count.textContent = `×${cityMembers.length}`;
          g.appendChild(count);
        }
        g.addEventListener("click", () => { if (Date.now() >= suppressMarkerClickUntil) openCity(city, cityMembers); });
        g.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openCity(city, cityMembers); }
        });
        markers.appendChild(g);
      });
    }

    function renderList(filtered) {
      const list = document.getElementById("member-list");
      list.innerHTML = "";
      document.getElementById("members-summary").textContent = `目前顯示 ${filtered.length} 位成員`;
      const unplaced = filtered.filter(member => !member.district);
      document.getElementById("unplaced-note").textContent = unplaced.length ? `${unplaced.map(member => member.name).join("、")} 的填答尚未精確到區，因此暫不在地圖插旗。` : "";
      if (!filtered.length) {
        list.innerHTML = '<div class="empty-state"><strong>沒有符合條件的球友</strong><span>調整或清除篩選後再看看。</span></div>';
        return;
      }
      filtered.forEach(member => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "member-row";
        button.innerHTML = `<span class="avatar">${initial(member.name)}</span><span class="member-main"><strong>${member.name}</strong><span>${member.level}</span></span><span class="city-tag">${member.city}</span>`;
        button.addEventListener("click", () => openMember(member));
        list.appendChild(button);
      });
    }

    function render() {
      const filtered = getFilteredMembers();
      const cities = new Set(filtered.map(member => member.district).filter(Boolean));
      document.getElementById("result-count").textContent = filtered.length;
      document.getElementById("city-count").textContent = cities.size;
      renderMarkers(filtered);
      renderList(filtered);
    }

    function openMember(member) {
      lastFocused = document.activeElement;
      document.getElementById("modal-heading").innerHTML = `<h2 class="modal-title" id="modal-title">${member.name}</h2><p class="modal-subtitle">${displayValue(member.locationRaw)}的桌球同好</p>`;
      document.getElementById("modal-content").innerHTML = `
        <dl class="detail-grid">
          <div class="detail"><dt>居住地</dt><dd>${displayValue(member.locationRaw)}</dd></div>
          <div class="detail"><dt>所屬縣市</dt><dd>${displayValue(member.county)}</dd></div>
          <div class="detail wide"><dt>桌球程度</dt><dd>${displayValue(member.level)}</dd></div>
          <div class="detail wide"><dt>較有空時間</dt><dd>${displayValue(member.freeTime)}</dd></div>
          <div class="detail"><dt>角色</dt><dd>${displayValue(member.role)}</dd></div>
          <div class="detail"><dt>是否單身</dt><dd>${displayValue(member.single)}</dd></div>
        </dl>
        <div class="message-box"><small>想說的話</small><p>${displayValue(member.message)}</p></div>`;
      modal.hidden = false;
      document.body.style.overflow = "hidden";
      modalClose.focus();
    }

    function openCity(city, cityMembers) {
      if (cityMembers.length === 1) { openMember(cityMembers[0]); return; }
      lastFocused = document.activeElement;
      document.getElementById("modal-heading").innerHTML = `<h2 class="modal-title" id="modal-title">${city}</h2><p class="modal-subtitle">這裡有 ${cityMembers.length} 位球友，請選一位查看</p>`;
      const picker = document.createElement("div");
      picker.className = "city-picker";
      cityMembers.forEach(member => {
        const button = document.createElement("button");
        button.type = "button";
        button.innerHTML = `<strong>${member.name}</strong><br><small>${member.level}</small>`;
        button.addEventListener("click", () => openMember(member));
        picker.appendChild(button);
      });
      const content = document.getElementById("modal-content");
      content.innerHTML = "";
      content.appendChild(picker);
      modal.hidden = false;
      document.body.style.overflow = "hidden";
      modalClose.focus();
    }

    function closeModal() {
      modal.hidden = true;
      document.body.style.overflow = "";
      if (lastFocused && typeof lastFocused.focus === "function") lastFocused.focus();
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", event => { if (event.target === modal) closeModal(); });
    document.addEventListener("keydown", event => { if (event.key === "Escape" && !modal.hidden) closeModal(); });

    setupFilters();
    setupMapNavigation();
    render();
  </script>
</body>
</html>
